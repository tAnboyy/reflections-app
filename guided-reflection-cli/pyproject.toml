[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-reflection-cli"
version = "0.1.0"
description = "Goal-directed guided reflection CLI built with LangGraph-style orchestration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2.40",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "pydantic>=2.11",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "python-dotenv>=1.0",
]

[project.scripts]
guided-reflection = "guided_reflection_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
